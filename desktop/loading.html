<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>正在生成图谱…</title>
<style>
  html, body { margin: 0; height: 100%; background: #f5f6f8; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; color: #555; }
  .wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 16px; padding: 0 24px; text-align: center; }
  .spinner { width: 36px; height: 36px; border: 4px solid #d8dce3; border-top-color: #4E79A7; border-radius: 50%; animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .t { font-size: 14px; }
  .sub { font-size: 12px; color: #98a0ad; line-height: 1.7; max-width: 420px; }
  .bar { width: 240px; height: 6px; background: #e6e9ef; border-radius: 4px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 40%; background: #4E79A7; border-radius: 4px; animation: slide 1.4s ease-in-out infinite; }
  @keyframes slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="spinner"></div>
    <div class="t">正在扫描仓库并生成提交图谱…</div>
    <div class="bar"><i></i></div>
    <div class="sub">正在解析 git 历史、按分支归属提交并抓取 diff。<br>仓库较大或选择「完整 diff」时，这一步可能持续数十秒，请稍候，完成后会自动打开图谱。</div>
  </div>
</body>
</html>
