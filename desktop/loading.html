<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>正在生成图谱…</title>
<style>
  html, body { margin: 0; height: 100%; background: #f5f6f8; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; color: #555; }
  .wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 14px; }
  .spinner { width: 34px; height: 34px; border: 4px solid #d8dce3; border-top-color: #4E79A7; border-radius: 50%; animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .t { font-size: 14px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="spinner"></div>
    <div class="t">正在扫描仓库并生成提交图谱…</div>
  </div>
</body>
</html>
